# ADD-ON ONLY: this is not a replacement nginx.conf or site configuration.
# Include inside the existing HTTPS server {} for akbulut.com.tm.
# Copy the CONTENTS of dist/ to /var/www/zawod/.
# Uses the gzip_static module already referenced by deploy/nginx-panel.conf.

location = /zawod {
    return 308 /zawod/;
}

# Vite's hashed JavaScript and CSS can be cached until their names change.
location ^~ /zawod/assets/ {
    root /var/www;
    try_files $uri =404;
    gzip_static on;
    gzip_vary on;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /zawod/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ /zawod/index.html;
    gzip_static on;
    gzip_vary on;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    # A missing image or model must return 404, never the SPA's HTML.
    # These public filenames are stable, so they use ETag revalidation.
    location ~* \.(?:glb|gltf|png|jpe?g|webp|gif|svg|ico|json|txt|wasm|js|css)$ {
        try_files $uri =404;
    }
}
